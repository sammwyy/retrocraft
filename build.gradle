plugins {
    id 'base'
    id 'com.diffplug.spotless' version '7.0.2'
}

ext.minecraftVersion = providers.gradleProperty('mc').getOrElse('1.21.1')
def targets = new groovy.json.JsonSlurper().parse(file('gradle/targets.json'))
if (!targets.containsKey(minecraftVersion)) throw new GradleException("Unknown Minecraft target: ${minecraftVersion}")
ext.target = targets[minecraftVersion]

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group
    repositories { mavenCentral() }
}

subprojects {
    layout.buildDirectory = rootProject.layout.buildDirectory.dir(
            name in ['core', 'worker'] ? "modules/${name}" : "targets/${rootProject.minecraftVersion}/${name}")
    plugins.withType(JavaPlugin) {
        def javaVersion = name in ['core', 'worker'] ? 21 : rootProject.target.java
        java { toolchain.languageVersion = JavaLanguageVersion.of(javaVersion) }
        tasks.withType(JavaCompile).configureEach { options.release = javaVersion }
        dependencies {
            testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
            testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        }
        tasks.withType(Test).configureEach { useJUnitPlatform() }
    }
}

spotless {
    java {
        target 'common/src/**/*.java', 'core/src/**/*.java', 'worker/src/**/*.java',
                'fabric/src/**/*.java', 'forge/src/**/*.java', 'compat/**/*.java'
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        importOrder('java', 'javax', 'org', 'com', 'net', '')
    }
}

def targetLoader = findProperty('loader') ?: 'fabric'
tasks.named('check') { dependsOn spotlessCheck, ':core:check', ':worker:check' }
tasks.named('assemble') { dependsOn ':core:assemble', ':worker:assemble' }
tasks.register('workerJar') { dependsOn ':worker:workerJar' }
if (targetLoader != 'none') {
    tasks.named('check') { dependsOn ":${targetLoader}:check" }
    tasks.named('assemble') { dependsOn ":${targetLoader}:assemble" }
    tasks.register('runGameTest') { dependsOn ":${targetLoader}:runGameTest" }
    tasks.register('runClient') { dependsOn ":${targetLoader}:runClient" }
}
