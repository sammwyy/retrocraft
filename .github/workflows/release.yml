name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          targets = json.loads(Path('gradle/targets.json').read_text())
          entries = [{'mc': mc, 'loader': loader, 'modern': mc == '1.21.11' or mc.startswith('26.')}
                     for mc, target in targets.items() for loader in ('fabric', 'forge')
                     if loader != 'forge' or target['forge'] is not None]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': entries}) + '\n')
          PY

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.modern
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare native client tests
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Build and test target
        env:
          TARGET_MC: ${{ matrix.mc }}
          TARGET_LOADER: ${{ matrix.loader }}
        run: |
          export JAVA21_HOME="$JAVA_HOME"
          export JAVA25_HOME="${JAVA_HOME_25_X64:-}"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != tag ]; then VERSION=0.1.1-dev; fi
          python3 tools/check_matrix.py --versions "$TARGET_MC" --loaders "$TARGET_LOADER" --mod-version "$VERSION" --artifact-dir build/release
      - name: Preserve validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.mc }}-${{ matrix.loader }}
          path: build/matrix/
      - uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.mc }}-${{ matrix.loader }}
          path: build/release/*.jar
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
